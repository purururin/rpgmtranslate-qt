name: Build Windows 64-bit (CMake)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0' 
        arch: 'win64_msvc2019_64'

    - name: Setup MSVC & Ninja
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Package Binary
      shell: pwsh
      run: |
        mkdir output
        # Adjust the exe name if it differs from the repo name
        copy build\rpgmtranslate-qt.exe output\ 
        windeployqt --release --no-translations --compiler-runtime output\rpgmtranslate-qt.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rpgmtranslate-qt-win64
        path: output/
