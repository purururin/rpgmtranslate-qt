name: Build Windows 64-bit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64'
        modules: 'qt5compat qtimageformats'

    - name: Setup MSVC & Ninja
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      shell: cmd
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_STANDARD=17 -DCMAKE_C_STANDARD_REQUIRED=OFF -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Package Binary
      shell: pwsh
      run: |
        mkdir output
        $exePath = Get-ChildItem -Path build -Filter *.exe -Recurse | Select-Object -First 1
        if ($exePath) {
            copy $exePath.FullName output\
            $targetExe = "output\" + $exePath.Name
            windeployqt --release --no-translations --compiler-runtime $targetExe
        } else {
            Write-Error "Executable not found in build directory!"
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rpgmtranslate-qt-win64
        path: output/
