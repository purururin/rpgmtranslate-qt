name: Build Windows 64-bit (Clang)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build x64 Release (Clang)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64' # We still use the MSVC-based Qt binaries
        modules: 'qt5compat qtimageformats'

    - name: Setup MSVC (Required for Windows SDK Headers)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install LLVM/Clang
      run: choco install llvm -y

    - name: Configure CMake
      shell: cmd
      run: |
        cmake -B build -G "Ninja" ^
        -DCMAKE_BUILD_TYPE=Release ^
        -DCMAKE_C_COMPILER=clang ^
        -DCMAKE_CXX_COMPILER=clang++ ^
        -DCMAKE_PREFIX_PATH="%Qt6_DIR%" ^
        -DQt6_DIR="%Qt6_DIR%"

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Package Binary
      shell: pwsh
      run: |
        if (!(Test-Path output)) { mkdir output }
        $exePath = Get-ChildItem -Path build -Filter *.exe -Recurse | Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
        if ($exePath) {
            copy $exePath.FullName output\
            $targetExe = "output\" + $exePath.Name
            windeployqt --release --no-translations --compiler-runtime $targetExe
        } else {
            Write-Error "Executable not found!"
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rpgmtranslate-qt-win64-clang
        path: output/
